name: arce

services:
  postgres:
    image: postgres:16-alpine
    container_name: arce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Definí POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-arce_licitaciones}
      TZ: ${TZ:-America/Montevideo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Solo en loopback, para desarrollo nativo (npm run pipeline:once) y psql.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: ./app
    container_name: arce_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      TZ: ${TZ:-America/Montevideo}
      TZ_LOCAL: ${TZ:-America/Montevideo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arce_licitaciones}
      # Ollama nativo o en otro contenedor del host (host.docker.internal). Con `--profile ollama` usar http://ollama:11434
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      RUBRO: ${RUBRO:-aluminio}
      CRON: ${CRON:-*/15 * * * *}
      CRON_ENABLED: ${CRON_ENABLED:-true}
      RUN_ON_START: ${RUN_ON_START:-true}
      MAX_ANALISIS_POR_CORRIDA: ${MAX_ANALISIS_POR_CORRIDA:-50}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  # Opcional: Ollama dentro del compose para quien no lo tenga en el host.
  #   docker compose --profile ollama up -d
  #   docker compose exec ollama ollama pull qwen3.5:9b
  # y en .env: OLLAMA_HOST=http://ollama:11434
  ollama:
    image: ollama/ollama:0.40.2
    container_name: arce_ollama
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m

volumes:
  postgres_data:
  app_data:
  ollama_data:
